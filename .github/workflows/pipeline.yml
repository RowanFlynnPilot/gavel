name: Pipeline & Deploy

on:
  schedule:
    # Every 4 hours — same cadence as the reference instance. Freshly
    # uploaded videos get ~6 caption attempts in the first 24 hours before
    # falling back to agenda-only.
    # Off the top of the hour — GitHub drops scheduled runs under load and
    # names :00 as its busiest time (the reference instance got ~4.7 of 6
    # daily runs at :00, Sept 2026). Offset from the reference's :17.
    - cron: '41 */4 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill ALL historical meetings (true/false)'
        required: false
        default: 'false'
      days:
        description: 'Process meetings from last N days (ignored if backfill=true)'
        required: false
        default: ''
      roundup:
        description: 'Generate the weekly newsletter roundup now (also auto-runs Mondays)'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: 'pages'
  # A newer scheduled run supersedes an older one — in August 2026 the
  # reference instance had a run wedge in "waiting" state and hold this
  # group for 23 days while every later run was silently cancelled.
  cancel-in-progress: true

jobs:
  pipeline-and-deploy:
    runs-on: ubuntu-latest
    # Backstop for hung fetches; normal runs finish in ~15 minutes, but a
    # post-outage recovery ingesting dozens of transcripts can run over an
    # hour (nothing commits until the end, so a mid-run kill re-spends the
    # API budget on retry).
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Deno
        # yt-dlp needs a JavaScript runtime to solve YouTube's "n challenge".
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Write YouTube cookies
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > /tmp/yt-cookies.txt
            echo "Cookies file written."
          else
            echo "No YOUTUBE_COOKIES secret — transcript fetches will rely on the residential fetcher."
          fi
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Run pipeline
        id: pipeline
        # continue-on-error: an API outage or a named auth/structure failure
        # (exit 1 by design) must not block the site deploy. A post-deploy
        # step re-surfaces the failure so the run still goes red.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_COOKIES_FILE: /tmp/yt-cookies.txt
          USE_WHISPER_FALLBACK: "false"
          # YouTube blocks cloud IPs regardless of cookies (verified Aug 30,
          # 2026); the residential fetcher is the transcript path.
          CAPTION_FETCH: "false"
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python -m engine.pipeline --backfill
          elif [ -n "${{ github.event.inputs.days }}" ]; then
            python -m engine.pipeline --days ${{ github.event.inputs.days }}
          else
            python -m engine.pipeline --days 14
          fi

      - name: Ingest residential transcripts
        id: ingest
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ ! -d transcripts ] || [ -z "$(ls transcripts/*.txt 2>/dev/null)" ]; then
            echo "No transcript files — skipping."
            exit 0
          fi
          # Per-file isolation (bash -e would abort the batch on one bad
          # file) and --video-id= equals form (YouTube IDs can start with a
          # dash, e.g. -SFidjEgoHg, which argparse otherwise eats as a flag).
          FAILED=0
          for TFILE in transcripts/*.txt; do
            VID=$(basename "$TFILE" .txt)
            echo "Ingesting transcript for: $VID"
            python -m engine.ingest_transcript --video-id="$VID" --transcript "$TFILE" \
              || { echo "::warning::transcript ingest failed for $VID (will retry next run)"; FAILED=$((FAILED+1)); }
            echo ""
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED transcript(s) failed to ingest"
            exit 1
          fi

      - name: Scrub residents' addresses and apply corrections
        # Backstop for the prompts' privacy rules (a resident's home address
        # never appears in a summary) and the step that re-applies every
        # logged fix in corrections.json, so re-summarizing can't undo one.
        # Runs after the last summarization and before the data file and
        # pages are rebuilt, so nothing unscrubbed is committed or deployed.
        # No API calls.
        run: python -m engine.scrub

      - name: Re-publish data
        # Ingest may have cleared injected IDs; publish-only is cheap and
        # idempotent. It builds from the sidecars the scrub just cleaned.
        run: python -m engine.pipeline --publish-only

      - name: Generate weekly newsletter roundup
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The cron fires ~6x on Mondays — only generate once per day
          # (checked via the API; the checkout is shallow).
          RUN=0
          if [ "${{ github.event.inputs.roundup }}" = "true" ]; then
            RUN=1
          elif [ "$(date -u +%u)" = "1" ]; then
            LAST=$(gh api "repos/${{ github.repository }}/commits?path=data/roundup.txt&per_page=1" \
              --jq '.[0].commit.committer.date[:10] // empty' 2>/dev/null || echo "")
            if [ "$LAST" = "$(date -u +%F)" ]; then
              echo "Roundup already generated today ($LAST) — skipping."
            else
              RUN=1
            fi
          fi
          if [ "$RUN" = "1" ]; then
            python -m engine.roundup
          else
            echo "Roundup not due — skipping."
          fi

      - name: Generate calendar feed, static pages, digest
        continue-on-error: true
        run: |
          python -m engine.ics --out data/meetings.ics
          python -m engine.pages --out-dir frontend/public
          python -m engine.digest --out frontend/public/digest.png

      - name: Commit state and data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f processed_meetings.json injected_meetings.json || true
          git add -f skipped_videos.json 2>/dev/null || true
          git add -f corrections.json 2>/dev/null || true
          git add -f summaries/ || true
          git add -f data/ || true
          git add -f frontend/public/meetings/ frontend/public/sitemap.xml frontend/public/robots.txt 2>/dev/null || true
          git status --short | head -20
          git diff --staged --quiet || git commit -m "chore: update meetings data [skip ci]"
          # Rebase before pushing: the residential fetcher pushes transcripts
          # between runs, and a rejected push here would discard this run's
          # state (re-summarizing everything next run = double API spend).
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || git rebase --abort || true
          git push || true

      - name: Stage runtime config + data for the frontend
        # The frontend fetches instance.json and data/*.json at runtime;
        # assets (avatars, logo) are referenced by instance.json paths.
        run: |
          cp instance.json frontend/public/
          mkdir -p frontend/public/data
          cp data/meetings.json data/upcoming.json frontend/public/data/
          cp data/meetings.ics frontend/public/meetings.ics 2>/dev/null || true
          cp data/roundup.txt data/roundup.html frontend/public/ 2>/dev/null || true
          cp -r assets frontend/public/assets

      - name: Build frontend
        env:
          # GitHub Pages serves a project site under /<repository name>/.
          BASE_PATH: '/${{ github.event.repository.name }}/'
        run: |
          # An event payload without the repository would build every asset
          # URL under "//" and deploy a blank site.
          if [ "$BASE_PATH" = "//" ]; then
            echo "::error::github.event.repository.name is empty for this event; cannot derive BASE_PATH."
            exit 1
          fi
          npm run build
        working-directory: frontend

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Maintain spending-alarm issue
        # data/costs.json records every Claude call (engine.claude). A
        # regression like the reference instance's June 2026 re-summarization
        # loop surfaces within a day instead of on the monthly bill.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEND_ALARM_DAY_USD: '2.00'
          SPEND_ALARM_DAY_CALLS: '40'
        run: |
          read -r STATUS DAY_USD <<< "$(python -m engine.costs --check --print-status --markdown spend_body.md)"
          echo "Claude spend, last 24h: \$${DAY_USD} (${STATUS})"
          EXISTING=$(gh issue list --state open --search "Unusual Claude API spend in:title" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "TRIPPED" ]; then
            TITLE="💸 Unusual Claude API spend (\$${DAY_USD} in the last 24h, checked $(date +%Y-%m-%d))"
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$TITLE" --body-file spend_body.md
            else
              gh issue create --title "$TITLE" --body-file spend_body.md
            fi
          elif [ "$STATUS" = "OK" ] && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Claude spend over the last 24 hours is back under the alarm thresholds (\$${DAY_USD}). Auto-closing."
          fi

      - name: Maintain overdue-upgrade issue
        # Agenda-only is the normal first state for most meetings; only an
        # upgrade that's LATE for its jurisdiction signals a break (on the
        # reference instance a title-format change stranded one body for four
        # weeks while a list-everything issue signaled nothing). The expected
        # lags are instance.json expected_lag_days. One issue; closes itself.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(python -m engine.overdue --print-count --markdown overdue_body.md)
          EXISTING=$(gh issue list --state open --search "Meeting summaries overdue in:title" --json number --jq '.[0].number // empty')
          if [ "$COUNT" -gt 0 ]; then
            TITLE="⏰ Meeting summaries overdue for an upgrade (${COUNT}, checked $(date +%Y-%m-%d))"
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$TITLE" --body-file overdue_body.md
              echo "Updated overdue issue #$EXISTING"
            else
              gh issue create --title "$TITLE" --body-file overdue_body.md
              echo "Opened overdue issue"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Nothing is overdue anymore — every displayed agenda-only meeting is within its jurisdiction's normal recording window. Auto-closing."
          else
            echo "No overdue upgrades."
          fi
          # The standing list this step replaced never closed itself.
          OLD=$(gh issue list --state open --search "Agenda-only meetings need transcripts in:title" --json number --jq '.[0].number // empty')
          if [ -n "$OLD" ]; then
            gh issue close "$OLD" --comment "Replaced by the overdue-upgrade issue, which lists only meetings past their jurisdiction's normal recording lag."
          fi

      - name: Maintain residential-fetcher issue
        # The residential machine is the only transcript path (CI can't reach
        # YouTube), and its scheduled task exits 0 even when the script fails
        # internally. The pipeline records when it first saw each video it
        # could not process (skipped_videos.json); one lingering past
        # STALE_VIDEO_HOURS (36h; normal lag is ~12h) means the residential
        # fetcher has probably stopped. No run report (the pipeline died
        # before writing it) leaves the issue untouched.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f agenda_only_report.json ]; then
            echo "No run report — skipping."
            exit 0
          fi
          STALE=$(python -m engine.watchdog --print-count --markdown stale_body.md)
          EXISTING=$(gh issue list --state open --search "Residential transcript fetcher may be down in:title" --json number --jq '.[0].number // empty')
          if [ "$STALE" -gt 0 ]; then
            TITLE="🏠 Residential transcript fetcher may be down (${STALE} video(s) stuck, checked $(date +%Y-%m-%d))"
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$TITLE" --body-file stale_body.md
              echo "Updated residential-fetcher issue #$EXISTING"
            else
              gh issue create --title "$TITLE" --body-file stale_body.md
              echo "Opened residential-fetcher issue"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "No videos stuck past the threshold anymore — the residential fetcher is delivering again. Auto-closing."
          else
            echo "No stale videos."
          fi

      - name: Surface pipeline failures
        # The pipeline/ingest steps use continue-on-error so the site still
        # deploys — this re-fails the run AFTER deploy so named errors
        # (TranscriptAuthError, AdapterStructureError, API outages) stay loud.
        if: steps.pipeline.outcome == 'failure' || steps.ingest.outcome == 'failure'
        run: |
          echo "::error::Pipeline or transcript ingest failed earlier in this run (site still deployed with existing data). Check the step logs — named errors identify cookie refresh vs adapter drift vs API outage."
          exit 1
