<script type="text/javascript">
    $(document).ready(function(){
        $(".age-editbtns script").remove();
        $('.agenda-search .text-input').on('input',function(){
            var filter = $(this).val().toLowerCase();
            $('table').each(function(){
                var $this = $(this);
                var tableText = $this.find('td').text().toLowerCase();
                if(!tableText.includes(filter)){
                    $this.fadeOut();
                } else {
                    $this.fadeIn();
                }
            })
        });
    });
</script>
